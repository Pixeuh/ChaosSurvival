<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="../../src/styles.css">
    <link rel="stylesheet" href="../../src/styles-smiley-pack-installer.css">
    <link rel="stylesheet" href="../../src/styles-toolbar-installer.css">
  </head>
  <body>
    <main class="desktop" style="position:relative;width:1100px;height:720px">
      <section id="playfield" style="position:absolute;inset:0;width:1100px;height:720px"></section>
      <footer class="taskbar"></footer>
    </main>
    <script type="module">
      window.__installerErrors = [];
      window.addEventListener('error', (event) => window.__installerErrors.push(event.message));
      window.addEventListener('unhandledrejection', (event) => window.__installerErrors.push(String(event.reason)));

      import { WindowManager } from '../../src/ui/windows.js';
      import { SmileyPackInstaller } from '../../src/ui/smiley-pack-installer.js';
      import { ToolbarInstaller } from '../../src/ui/toolbar-installer.js';

      const manager = new WindowManager(document.querySelector('#playfield'), () => {});
      const applications = {
        instances: new Map(),
        attachWindow(key, id, title) {
          const instance = {
            key,
            id,
            title,
            element: manager.windows.get(id).element,
            task: document.createElement('button'),
          };
          this.instances.set(key, instance);
          return instance;
        },
        restore(instance) { instance.element.hidden = false; },
        onWindowState() {},
      };

      const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
      async function runScenario(kind) {
        const installer = kind === 'smiley'
          ? new SmileyPackInstaller(manager, applications)
          : new ToolbarInstaller(manager, applications);
        const instance = installer.open(kind === 'smiley' ? 'smiley-pack-2009-folder/smiley pack 2009.exe' : undefined);
        const rootSelector = kind === 'smiley' ? '.smiley-pack-installer-content' : '.toolbar-installer-content';
        const root = instance.element.querySelector(rootSelector);
        if (kind === 'toolbar') root.querySelector('[data-action="next"]').click();
        root.querySelector('[data-action="install"]').click();
        const progress = instance.element.querySelector('progress');
        const initial = progress.value;
        const target = kind === 'smiley' ? 43 : 78;
        const samples = [];
        for (const duration of [1000, 1000]) {
          await wait(duration);
          samples.push(progress.value);
        }
        await wait(kind === 'smiley' ? 550 : 650);
        const stopped = {
          value: progress.value,
          step: instance.step,
          cursor: getComputedStyle(instance.element).cursor,
          max: progress.max,
          connected: progress.isConnected,
        };
        await wait(1100);
        const failed = {
          step: instance.step,
          text: root.textContent,
          cursor: getComputedStyle(instance.element).cursor,
          connected: instance.element.isConnected,
        };
        manager.close(instance.id);
        return { initial, samples, stopped, failed, target };
      }

      window.runInstallerDomScenarios = async () => ({
        scenarios: {
          smiley: await runScenario('smiley'),
          toolbar: await runScenario('toolbar'),
        },
        errors: window.__installerErrors,
      });
    </script>
  </body>
</html>
